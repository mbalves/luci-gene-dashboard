services:
  db:
    image: postgres:15
    container_name: luci-gene-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luci
      POSTGRES_PASSWORD: lucipass
      POSTGRES_DB: luci_gene_db
    ports:
      - "5432:5432"
    volumes:
      - luci_gene_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luci -d luci_gene_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luci_gene_pgdata:
